    <rect x="880" y="262" width="65" height="52" rx="2"/>
    <!-- shelves line work -->
    <path d="M250 130H350M390 130H490" opacity="0.35"/>
  </g>

  <!-- plant and pendant accents -->
  <g fill="none" stroke="#1E5660" stroke-width="1.6" opacity="0.8">
    <path d="M760 300V282H790V300"/>
    <path d="M775 282C765 262 752 256 748 244M775 282C782 262 796 252 804 246M775 282C774 262 774 250 772 238"/>
    <path d="M600 40V85M583 85H617L608 100H592Z"/>

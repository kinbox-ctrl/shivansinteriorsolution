    <!-- chimney hood -->
    <path d="M430 230L400 262H540L510 230" />
    <!-- backsplash and counter -->
    <path d="M230 300H840" stroke-width="3"/>
    <path d="M225 300H845V312H225Z"/>
    <!-- base units -->
    <rect x="230" y="312" width="610" height="100" rx="2"/>
    <path d="M380 312V412M530 312V412M690 312V412"/>
    <path d="M230 345H380M230 378H380" />
    <path d="M285 328H325M285 361H325M285 394H325M435 328H475M585 328H625M745 328H785" stroke-width="3"/>
    <!-- hob and sink on the counter -->
    <path d="M425 292H515M435 286H465M475 286H505"/>
    <path d="M610 300C610 285 650 285 650 300M640 300V270Q640 258 628 258H620"/>
    <!-- plinth -->
    <path d="M236 412H834V420H236Z" opacity="0.6"/>

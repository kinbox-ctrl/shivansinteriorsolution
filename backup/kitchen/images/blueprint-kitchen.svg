    <text x="535" y="69">2440 mm</text>
    <text x="180" y="366" transform="rotate(-90 180 360)" style="paint-order:stroke" stroke="#F6FAF9" stroke-width="10">900 mm</text>
    <text x="1080" y="266" transform="rotate(-90 1080 260)" style="paint-order:stroke" stroke="#F6FAF9" stroke-width="10">2100 mm</text>

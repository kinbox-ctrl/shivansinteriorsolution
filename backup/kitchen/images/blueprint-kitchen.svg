<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#9EC3C1" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <pattern id="G" width="125" height="125" patternUnits="userSpaceOnUse">

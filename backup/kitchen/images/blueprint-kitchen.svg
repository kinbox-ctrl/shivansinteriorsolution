  <!-- dimensions -->
  <g stroke="#B85F2C" stroke-width="1.6" fill="none">
    <path d="M230 62H840" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M230 52V102M840 52V102" opacity="0.7"/>
    <path d="M180 300V420" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M170 300H222M170 420H222" opacity="0.7"/>
    <path d="M1080 110V412" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M1048 110H1090M1048 412H1090" opacity="0.7"/>

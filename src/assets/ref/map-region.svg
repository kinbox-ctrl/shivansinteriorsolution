    <text x="60" y="632" text-anchor="middle">Nawa</text>
    <text x="900" y="516" text-anchor="middle" font-size="20">Jaipur</text>
    <text x="560" y="134" text-anchor="middle" font-weight="500" font-size="14">Phulera</text>
    <text x="690" y="500" text-anchor="middle" font-weight="500" font-size="14">Jobner</text>
    <text x="330" y="96" text-anchor="middle" font-weight="500" font-size="14">Kishangarh Renwal</text>
    <text x="760" y="670" text-anchor="middle" font-weight="500" font-size="14">Bagru</text>
    <text x="820" y="136" text-anchor="middle" font-weight="500" font-size="14">Chomu</text>

    <path d="M0 460C160 400 320 440 480 400S760 420 900 380 1100 430 1200 390V460Z"/>
  </g>
  <!-- Sambhar Lake -->
  <path d="M110 250C150 190 250 170 330 190 400 210 430 250 470 245 520 240 560 275 540 320 520 365 440 380 370 372 300 365 250 400 190 380 130 360 80 300 110 250Z" fill="#DCE9E7" stroke="#B8D3CF" stroke-width="2"/>
  <path d="M150 260C200 230 280 220 340 235M180 320C240 300 320 300 400 320" fill="none" stroke="#C9DEDB" stroke-width="1.5"/>
  <text x="300" y="300" text-anchor="middle" font-size="18" font-style="italic" fill="#5C8F8B">Sambhar Lake</text>
  <!-- roads -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 420C180 350 330 300 470 210S760 120 1200 150"/>
    <path d="M540 150C560 200 570 260 600 330S700 420 780 460"/>
    <path d="M0 200C60 210 110 200 160 180"/>
  </g>
  <g fill="none" stroke="#D3CEC3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 420C180 350 330 300 470 210S760 120 1200 150"/>
    <path d="M540 150C560 200 570 260 600 330S700 420 780 460"/>
    <path d="M0 200C60 210 110 200 160 180"/>
  </g>
  <g font-size="12" fill="#8A8479">
    <text x="880" y="140" transform="rotate(-6 880 140)">NH-48 · Nawa Road</text>
    <text x="640" y="380" transform="rotate(48 640 380)">To Ajmer</text>
  </g>
  <!-- towns -->
  <g fill="#FFFFFF" stroke="#B9B2A4" stroke-width="1.5">
    <circle cx="470" cy="210" r="6"/><circle cx="60" cy="420" r="6"/><circle cx="1150" cy="150" r="6"/><circle cx="600" cy="330" r="5"/><circle cx="840" cy="110" r="5"/>
  </g>
  <g font-size="15" font-weight="600" fill="#0F2E30">

    <text x="60" y="404" text-anchor="middle">25 km</text>
  </g>
  <!-- workshop pin -->
  <g transform="translate(470 210)">
    <ellipse cx="0" cy="6" rx="16" ry="6" fill="#0F2E30" opacity="0.12"/>
    <path d="M0-46C-15-46-26-35-26-20 -26-4 0 6 0 6S26-4 26-20C26-35 15-46 0-46Z" fill="#A9531F"/>
    <circle cx="0" cy="-21" r="9" fill="#FFFDF8"/>
    <rect x="36" y="-38" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#E6E3DB"/>
    <text x="111" y="-16" text-anchor="middle" font-size="15" font-weight="700" fill="#003C48">Shivansh · Sambhar</text>

    <text x="1150" y="182" text-anchor="middle">Jaipur</text>
    <text x="600" y="358" text-anchor="middle" font-weight="500">Jobner</text>
    <text x="840" y="98" text-anchor="middle" font-weight="500">Phulera</text>
  </g>
  <g font-size="12" fill="#5C6F70">

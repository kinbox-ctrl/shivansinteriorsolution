<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6E3DB" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="#F4F1EA"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <!-- fields -->
  <g fill="#ECE8DF">
